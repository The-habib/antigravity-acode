name: CI & Security Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Shell Syntax Validation
        run: |
          sh -n install.sh
          sh -n update.sh
          sh -n uninstall.sh
          sh -n bin/agy-doctor
          sh -n bin/agy-update
          sh -n bin/agy-setup
          sh -n tests/test_security.sh
          sh -n tests/test_adversarial.sh
          sh -n tests/test_setup.sh
          sh -n tests/test_bootstrap.sh
          sh -n tests/run_tests.sh

      - name: Assert No Large Binaries Committed
        run: |
          echo "Checking for accidental large binary commits..."
          LARGE_FILES=$(find . -type f -size +1M ! -path "./.git/*")
          if [ -n "$LARGE_FILES" ]; then
            echo "Error: Found large binary files committed to repository:"
            echo "$LARGE_FILES"
            exit 1
          fi
          echo "✓ No large binaries found in repository."

      - name: Assert Repository Structure & Executable Modes
        run: |
          test -f README.md
          test -f install.sh
          test -f update.sh
          test -f uninstall.sh
          test -f VERSION
          test -f LICENSE
          test -f .gitignore
          test -f bin/agy-doctor
          test -f bin/agy-update
          test -f bin/agy-setup
          echo "✓ Repository structure verified."

      - name: Run Unit & Security Test Suite
        run: |
          chmod +x tests/*.sh bin/* install.sh update.sh uninstall.sh
          ./tests/run_tests.sh

  alpine_container_check:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Minimal Prerequisites (curl, tar, xz; ar/binutils ABSENT)
        run: |
          apk add --no-cache curl tar xz coreutils

      - name: Verify ar is absent initially in minimal Alpine test environment
        run: |
          if command -v ar >/dev/null 2>&1; then
            echo "Error: ar should be absent in minimal Alpine container!"
            exit 1
          fi
          echo "✓ Confirmed: ar is absent in minimal Alpine test container."

      - name: Run Master Test Suite inside Alpine Linux Container
        run: |
          chmod +x tests/*.sh bin/* install.sh update.sh uninstall.sh
          ./tests/run_tests.sh

      - name: Execute Full install.sh Self-Bootstrapping Integration Test
        run: |
          ./install.sh

      - name: Verify ar was automatically bootstrapped via apk binutils
        run: |
          command -v ar
          echo "✓ Confirmed: ar was automatically bootstrapped by install.sh."

      - name: Execute Idempotent Re-installation Test (when ar exists)
        run: |
          ./install.sh
          echo "✓ Confirmed: Re-installation succeeded when ar exists."
